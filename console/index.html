<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>控制台 · Pomeloc</title>
    <meta name="description" content="部署在这台服务器上的服务状态与控制台。" />
  </head>
  <body class="console-body" data-surface="paper">
    <div class="shell">
      <header class="masthead">
        <div class="masthead__id">
          <span class="eyebrow">Pomeloc</span>
          <h1 class="masthead__mark">控制台</h1>
        </div>

        <dl class="masthead__facts">
          <div class="fact">
            <dt class="eyebrow">主机</dt>
            <dd id="host-name">—</dd>
          </div>
          <div class="fact">
            <dt class="eyebrow">采集时间</dt>
            <dd id="fetch-at">尚未采集</dd>
          </div>
          <div class="fact">
            <dt class="eyebrow">自动刷新</dt>
            <dd><span id="auto-state">开</span> · 30s</dd>
          </div>
        </dl>

        <div class="masthead__tools">
          <a class="back" href="/">← 返回索引</a>
          <button class="btn" id="refresh" type="button">立即刷新</button>
        </div>
      </header>

      <div class="banner" id="banner" role="status" hidden></div>

      <main class="panel">
        <div class="panel__head">
          <h2 class="panel__title">服务</h2>
          <p class="panel__hint">
            只提供白名单内的操作。静态站点与危险目标不提供启停。
          </p>
        </div>

        <ul class="list" id="list" aria-live="polite" aria-busy="true">
          <li class="skeleton-row"></li>
          <li class="skeleton-row"></li>
          <li class="skeleton-row"></li>
        </ul>
      </main>

      <section class="drawer" id="drawer" hidden aria-labelledby="drawer-title">
        <div class="drawer__head">
          <h2 class="drawer__title" id="drawer-title">日志</h2>
          <button class="btn btn--quiet" id="drawer-close" type="button">关闭</button>
        </div>
        <pre class="logs" id="logs" tabindex="0">加载中…</pre>
      </section>

      <footer class="colophon">
        <p>
          启停操作直接作用于宿主机上的容器与 systemd 单元。停止一个服务不会影响其他服务。
        </p>
        <p class="colophon__meta">
          <span>127.0.0.1:8787</span>
          <span>nginx 反代 · Basic Auth</span>
        </p>
      </footer>
    </div>

    <script type="module" src="/src/console.ts"></script>
  </body>
</html>
