    # ===== 控制台：/console/ (added 2026-10-02) =====
    # 公开只读概览：首页要读它，所以免鉴权。
    # 用精确匹配 (=) 只放行这一个路径；其余 /console/api/ 一律走下面的
    # ^~ 块，仍然要 Basic Auth。后端也把该端点写成只读、不含敏感字段。
    location = /console/api/public/overview {
        rewrite ^/console/api/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Console-Token "__CONSOLE_TOKEN__";
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        access_log /www/wwwlogs/console.access.log;
        error_log /www/wwwlogs/console.error.log;
    }

    # API 块写在前面。nginx 前缀匹配取最长者，所以 /console/api/xxx 命中它，
    # 不会落到下面的 /console/ 上。两处都要 Basic Auth。
    location ^~ /console/api/ {
        # 鉴权由后端按会话 cookie 判定（/login 换 cookie，/session 查状态）。
        # 不再用 nginx Basic Auth：浏览器原生弹窗不能提示用户名，
        # 401 页面也没有回到登录的入口。
        # 仍注入共享密钥，确保只有经 nginx 的请求能到达后端。
        rewrite ^/console/api/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Console-Token "__CONSOLE_TOKEN__";
        # 启停操作最长约 6 秒（docker stop -t 5），留足余量避免 499
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;

        access_log /www/wwwlogs/console.access.log;
        error_log /www/wwwlogs/console.error.log;
    }

    location = /console {
        return 301 /console/;
    }

    location ^~ /console/ {
        root /www/wwwroot/northframe;
        index index.html;
        try_files $uri $uri/ /console/index.html;

        access_log /www/wwwlogs/console.access.log;
        error_log /www/wwwlogs/console.error.log;
    }
