    # ===== 控制台：/console/ (added 2026-10-02) =====
    # API 块写在前面。nginx 前缀匹配取最长者，所以 /console/api/xxx 命中它，
    # 不会落到下面的 /console/ 上。两处都要 Basic Auth。
    location ^~ /console/api/ {
        auth_basic "Pomeloc Console";
        auth_basic_user_file /www/server/nginx/conf/pomeloc.htpasswd;

        # 剥离 /console/api 前缀后转给本机后端，并注入共享密钥。
        # 密钥只在 nginx 与后端之间传递，浏览器拿不到。
        rewrite ^/console/api/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Console-Token "__CONSOLE_TOKEN__";
        # 启停操作最长约 6 秒（docker stop -t 5），留足余量避免 499
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;

        access_log /www/wwwlogs/console.access.log;
        error_log /www/wwwlogs/console.error.log;
    }

    location = /console {
        return 301 /console/;
    }

    location ^~ /console/ {
        auth_basic "Pomeloc Console";
        auth_basic_user_file /www/server/nginx/conf/pomeloc.htpasswd;

        root /www/wwwroot/northframe;
        index index.html;
        try_files $uri $uri/ /console/index.html;

        access_log /www/wwwlogs/console.access.log;
        error_log /www/wwwlogs/console.error.log;
    }
