server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /bookmarks {
    return 301 /bookmarks/;
  }

  location ^~ /bookmarks/ {
    try_files $uri $uri/ /bookmarks/index.html;
  }

  location ^~ /assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /favicon.svg {
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri =404;
  }
}
