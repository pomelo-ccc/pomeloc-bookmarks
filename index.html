<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomeloc</title>
    <meta
      name="description"
      content="Pomeloc 团队工具入口：接口文档、事件架构、书签与私有 API 网关。"
    />
  </head>
  <body class="portal-body" data-surface="paper">
    <div class="portal-shell">
      <div class="portal-grid" aria-hidden="true"></div>
      <div class="portal-planes" aria-hidden="true">
        <span class="portal-plane portal-plane--left"></span>
        <span class="portal-plane portal-plane--right"></span>
      </div>

      <header class="portal-nav">
        <div class="portal-brand">
          <p class="portal-brand__eyebrow">PRIVATE INDEX</p>
          <a class="portal-brand__mark" href="/">Pomeloc</a>
        </div>

        <nav class="portal-menu" aria-label="Primary">
          <a class="is-active" href="/">Portal</a>
          <a href="/doc-search/">Docs</a>
          <a href="/event-architecture/">Events</a>
          <a href="/bookmarks/">Bookmarks</a>
          <a href="/api/">API</a>
        </nav>

        <label class="portal-surface">
          <span>Surface</span>
          <select id="surface-select" aria-label="Surface selector">
            <option value="paper">Paper</option>
            <option value="gallery">Gallery</option>
            <option value="slate">Slate</option>
          </select>
        </label>
      </header>

      <main class="portal-main">
        <section class="portal-copy">
          <div class="portal-copy__heading">
            <p class="portal-copy__kicker">Pomeloc · Interactive Index</p>
            <h1 class="portal-copy__title">设计模式</h1>
          </div>
          <figure class="portal-book">
            <canvas
              id="portal-book-canvas"
              aria-label="设计模式：当前页面为 Interface Docs，点击进入"
              role="link"
              tabindex="0"
            ></canvas>
            <div class="portal-book__controls">
              <figcaption id="portal-book-caption" aria-live="polite">
                Interface Docs · /doc-search/
              </figcaption>
            </div>
            <div class="portal-book__fallback">
              <strong>设计模式</strong>
              <a href="/doc-search/">01 · Interface Docs</a>
              <a href="/event-architecture/">02 · Event Architecture</a>
              <a href="/bookmarks/">03 · Bookmarks</a>
              <a href="/api/">04 · API Gateway</a>
            </div>
          </figure>
        </section>
      </main>
    </div>

    <script type="module" src="/src/portal.ts"></script>
  </body>
</html>
