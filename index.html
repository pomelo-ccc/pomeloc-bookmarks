<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomeloc · 控制室</title>
    <meta name="description" content="个人控制室：服务入口与实时状态。" />
    <script type="module" src="/src/portal.ts"></script>
  </head>
  <body class="room" data-surface="slate">
    <canvas class="room__field" id="field" aria-hidden="true"></canvas>
    <div class="room__scan" aria-hidden="true"></div>

    <div class="room__shell">
      <header class="deck">
        <div class="deck__left">
          <span class="tag">Personal Control Room</span>
          <h1 class="deck__name">Pomeloc</h1>
        </div>

        <div class="deck__clock">
          <span class="clock__time" id="clock-time">--:--:--</span>
          <span class="clock__meta">
            <span id="clock-date">----</span>
            <span class="dot-sep">·</span>
            <span id="host-name">连接中</span>
          </span>
        </div>

        <div class="deck__right">
          <div class="vital" data-vital="load">
            <span class="vital__label">负载</span>
            <span class="vital__meter"><i style="--v:0"></i></span>
            <span class="vital__val" id="v-load">—</span>
          </div>
          <div class="vital" data-vital="mem">
            <span class="vital__label">内存</span>
            <span class="vital__meter"><i style="--v:0"></i></span>
            <span class="vital__val" id="v-mem">—</span>
          </div>
          <div class="vital" data-vital="disk">
            <span class="vital__label">磁盘</span>
            <span class="vital__meter"><i style="--v:0"></i></span>
            <span class="vital__val" id="v-disk">—</span>
          </div>
          <div class="vital vital--text">
            <span class="vital__label">运行</span>
            <span class="vital__val vital__val--wide" id="v-uptime">—</span>
          </div>
        </div>
      </header>

      <main class="deck__main" id="index">
        <section class="bay" aria-labelledby="bay-apps">
          <div class="bay__head">
            <h2 class="bay__title" id="bay-apps">服务</h2>
            <span class="bay__count" id="svc-count">—</span>
          </div>

          <ol class="grid" id="services">
            <li class="tile tile--ghost"></li>
            <li class="tile tile--ghost"></li>
            <li class="tile tile--ghost"></li>
            <li class="tile tile--ghost"></li>
            <li class="tile tile--ghost"></li>
            <li class="tile tile--ghost"></li>
          </ol>
        </section>

        <section class="bay bay--side" aria-labelledby="bay-ops">
          <div class="bay__head">
            <h2 class="bay__title" id="bay-ops">运维</h2>
          </div>
          <a class="ops" href="/console/">
            <span class="ops__glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="4" width="18" height="16" rx="1.5" />
                <path d="M7 9l3 3-3 3M13 15h4" />
              </svg>
            </span>
            <span class="ops__name">控制台</span>
            <span class="ops__desc">启停服务、看实时日志</span>
            <span class="ops__lock">需登录</span>
          </a>
        </section>
      </main>

      <footer class="deck__foot">
        <span id="foot-host">—</span>
        <span class="dot-sep">·</span>
        <span id="foot-platform">—</span>
        <span class="dot-sep">·</span>
        <span>更新于 <time id="foot-at">—</time></span>
        <span class="deck__pulse" id="foot-pulse">实时</span>
      </footer>
    </div>
  </body>
</html>
